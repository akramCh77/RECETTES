services:
  mongo:
    image: mongo:latest
    container_name: mern-recettes-mongodb
    restart: always
    volumes:
      - mongodb_data:/data/db
      - ./recettes.json:/recettes.json:ro
      - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    ports:
      - "27017:27017"
    networks:
      - mern-recettes-network

  backend:
    build: ./Back_end
    container_name: mern-recettes-backend
    restart: always
    environment:
      - MONGO_URI=mongodb://mongo:27017/Recettes 
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    volumes:
      - ./Back_end:/app
      - /app/node_modules
    networks:
      - mern-recettes-network

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mern-recettes-frontend
    restart: always
    environment:
      - VITE_API_URL=http://localhost:5000
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - mern-recettes-network

networks:
  mern-recettes-network:
    driver: bridge

volumes:
  mongodb_data: